   Helpers

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const initials = (name = "") => name.trim().split(/\s+/).slice(0, 2).map((p) => p[0] || "").join("").toUpperCase() || "?";
const fmtDate = (v) => (v ? new Date(v).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "—");
const fmtRel = (v) => {
  if (!v) return "Never";
  const s = (Date.now() - new Date(v).getTime()) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  if (s < 604800) return `${Math.floor(s / 86400)} d ago`;
  return new Date(v).toLocaleDateString();
};
const gradientCss = (cls = "") => {
  const from = /from-([a-z]+)-\d+/.exec(cls)?.[1], to = /to-([a-z]+)-\d+/.exec(cls)?.[1];
  const a = TW[from] || "#888", b = TW[to] || a;
  return `linear-gradient(135deg, ${a}55, ${b}55)`;
};
const markdownPreview = (text = "") =>
  String(text).split("\n").map((line) => {
    const html = esc(line).replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>").replace(/\*(.*?)\*/g, "<em>$1</em>");
    return `<div class="line">${html || "&nbsp;"}</div>`;
  }).join("");
const randomPassword = () => {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%";
  const arr = crypto.getRandomValues(new Uint32Array(14));
  return [...arr].map((n) => chars[n % chars.length]).join("");
};
const debounce = (fn, ms = 300) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/* ============================================================================
   State, API, auth
   ========================================================================== */
const state = {
  token: localStorage.getItem("ca_token"),
  expiresAt: Number(localStorage.getItem("ca_expires_at")) || 0,
  user: JSON.parse(localStorage.getItem("ca_user") || "null"),
  newMessages: 0,
};

const saveSession = ({ token, expires_at, user }) => {
  Object.assign(state, { token, expiresAt: expires_at, user });
  localStorage.setItem("ca_token", token);
  localStorage.setItem("ca_expires_at", String(expires_at));
  localStorage.setItem("ca_user", JSON.stringify(user));
};

const logout = (message) => {
  ["ca_token", "ca_expires_at", "ca_user"].forEach((k) => localStorage.removeItem(k));
  Object.assign(state, { token: null, expiresAt: 0, user: null });
  closeModal();
  renderLogin(message);
};

class ApiErr extends Error {
  constructor(message, status, details) { super(message); this.status = status; this.details = details; }
}

async function api(path, { method = "GET", body, form } = {}) {
  const headers = {};
  if (state.token) headers.Authorization = `Bearer ${state.token}`;
  let payload;
  if (form) payload = form;
  else if (body !== undefined) { headers["Content-Type"] = "application/json"; payload = JSON.stringify(body); }

  let res;
  try { res = await fetch(API + path, { method, headers, body: payload }); }
  catch { throw new ApiErr("Cannot reach the server. Check that the backend is running and you are online.", 0); }

  const json = await res.json().catch(() => null);
  if (json === null) {
    // not a response from the ClickAddis API (wrong server / address)
    throw new ApiErr(`The server at ${API} is not the ClickAddis API (HTTP ${res.status}). Open the admin at http://localhost:5000/admin or fix the API address under “Server settings”.`, res.status);
  }
  if (res.status === 401 && state.token && path !== "/auth/login") {
    logout(json.error?.message || "Your session has expired. Please log in again.");
    throw new ApiErr("Session expired", 401);
  }
  if (!res.ok || json.success === false) {
    throw new ApiErr(json.error?.message || `Request failed (${res.status})`, res.status, json.error?.details);
  }
  return json;
}

/* ============================================================================
   UI primitives: toast, modal, confirm
   ========================================================================== */
function toast(message, type = "success") {
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  el.innerHTML = `${icon(type === "success" ? "check" : type === "error" ? "alert" : "info")}<div class="grow">${esc(message)}</div>`;
  $("#toasts").appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .3s"; setTimeout(() => el.remove(), 300); }, type === "error" ? 6000 : 3200);
}
const toastError = (err) => { if (err?.status !== 401) toast(err?.message || "Something went wrong", "error"); };

let modalCleanup = null;
function openModal({ title, body, footer = "", size = "" }) {
  closeModal();
  const root = document.createElement("div");
  root.className = "modal-root";
  root.id = "modal";
  root.innerHTML = `
    <div class="modal card ${size}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal-head"><h3>${esc(title)}</h3><button class="btn ghost icon" data-action="close-modal" aria-label="Close">${icon("x")}</button></div>
      <div class="modal-body">${body}</div>
      ${footer ? `<div class="modal-foot">${footer}</div>` : ""}
    </div>`;
  root.addEventListener("mousedown", (e) => { if (e.target === root) closeModal(); });
  const onKey = (e) => { if (e.key === "Escape") closeModal(); };
  document.addEventListener("keydown", onKey);
  modalCleanup = () => document.removeEventListener("keydown", onKey);
  document.body.appendChild(root);
  setTimeout(() => $("input:not([type=hidden]):not([type=checkbox]):not([type=file]), textarea, select", root)?.focus(), 30);
  return root;
}
function closeModal() {
  $("#modal")?.remove();
  if (modalCleanup) { modalCleanup(); modalCleanup = null; }
}
function confirmDialog({ title = "Are you sure?", message, confirmText = "Delete", danger = true }) {
  return new Promise((resolve) => {
    const root = openModal({
      title, size: "sm",
      body: `<p style="margin:0">${message}</p>`,
      footer: `<button class="btn" data-ref="no">Cancel</button><button class="btn ${danger ? "danger" : "primary"}" data-ref="yes">${esc(confirmText)}</button>`,
    });
    let done = false;
    const finish = (v) => { if (done) return; done = true; closeModal(); resolve(v); };
    $('[data-ref="yes"]', root).addEventListener("click", () => finish(true));
    $('[data-ref="no"]', root).addEventListener("click", () => finish(false));
    new MutationObserver((_, obs) => { if (!document.body.contains(root)) { obs.disconnect(); finish(false); } })
      .observe(document.body, { childList: true });
  });
}
const setBusy = (btn, busy, label) => {
  if (!btn) return;
  if (busy) { btn.dataset.label = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<span class="spinner"></span>${label ? esc(label) : ""}`; }
  else { btn.disabled = false; if (btn.dataset.label) btn.innerHTML = btn.dataset.label; }
};

/* ============================================================================
   Form builder
   ========================================================================== */
// field: { name, label, type, required, help, placeholder, options, span, step, min, max, rows }
function fieldHtml(f, value) {
  const id = `f_${f.name}`;
  const req = f.required ? '<span class="req">*</span>' : "";
  const v = value ?? (f.default !== undefined ? f.default : "");
  const attrs = `id="${id}" name="${esc(f.name)}" ${f.required ? "required" : ""} ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ""}`;
  const help = f.help ? `<div class="help">${f.help}</div>` : "";
  const err = `<div class="err hidden" data-err="${esc(f.name)}"></div>`;
  const span = f.span === "all" ? "span-all" : f.span === 2 ? "span-2" : "";
  let control;

  switch (f.type) {
    case "textarea":
      control = `<textarea class="textarea ${f.tall ? "tall" : ""}" ${attrs} rows="${f.rows || 4}" maxlength="${f.max || 5000}">${esc(v)}</textarea>`;
      break;
    case "number":
      control = `<input class="input" type="number" ${attrs} value="${esc(v)}" step="${f.step || 1}" ${f.min !== undefined ? `min="${f.min}"` : ""} ${f.max !== undefined ? `max="${f.max}"` : ""} />`;
      break;
    case "bool":
      return `<div class="field ${span}"><label class="switch" style="margin-top:${f.inline ? 0 : 22}px"><input type="checkbox" id="${id}" name="${esc(f.name)}" ${(value ?? f.default) ? "checked" : ""} /><span class="track"></span><span>${esc(f.label)}</span></label>${help}</div>`;
    case "select":
      control = `<select class="select" ${attrs}>${f.options.map(([val, label]) => `<option value="${esc(val)}" ${String(val) === String(v) ? "selected" : ""}>${esc(label)}</option>`).join("")}</select>`;
      break;
    case "icon":
      control = `<select class="select" ${attrs}>${!ICON_KEYS.includes(v) && v ? `<option value="${esc(v)}" selected>${esc(v)} (unknown)</option>` : ""}${ICON_KEYS.map((k) => `<option value="${k}" ${k === v ? "selected" : ""}>${k}</option>`).join("")}</select>`;
      break;
    case "gradient": {
      const opts = GRADIENTS.includes(v) || !v ? GRADIENTS : [v, ...GRADIENTS];
      control = `<div class="row"><span class="swatch" data-swatch style="background:${gradientCss(v || GRADIENTS[0])}"></span>
        <select class="select grow" ${attrs} data-gradient>${opts.map((g) => `<option value="${esc(g)}" ${g === v ? "selected" : ""}>${esc(g)}</option>`).join("")}</select></div>`;
      break;
    }
    case "keywords":
      control = `<input class="input" type="text" ${attrs} value="${esc(Array.isArray(v) ? v.join(", ") : v)}" />`;
      break;
    case "password":
      control = `<div class="input-group"><input class="input" type="text" autocomplete="new-password" ${attrs} value="${esc(v)}" minlength="8" />
        <button type="button" class="btn icon" data-action="gen-password" data-target="${id}" title="Generate password">${icon("dice")}</button></div>`;
      break;
    default:
      control = `<input class="input" type="${f.type === "email" ? "email" : f.type === "url" ? "url" : "text"}" ${attrs} value="${esc(v)}" maxlength="${f.max || 500}" ${f.pattern ? `pattern="${f.pattern}"` : ""} />`;
  }
  return `<div class="field ${span}"><label for="${id}">${esc(f.label)}${req}</label>${control}${help}${err}</div>`;
}

function imageFieldHtml(img, currentUrl) {
  return `<div class="field span-all"><label>${esc(img.label)}</label>
    <div class="img-field">
      <div class="preview" data-img-preview>${currentUrl ? `<img src="${esc(currentUrl)}" alt="" />` : `${icon("image")}`}</div>
      <div class="stack" style="gap:8px">
        <input type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" name="__image" class="input" data-img-input />
        <div class="help">JPEG, PNG, WebP, GIF or AVIF · max 5 MB · stored on Cloudinary</div>
        ${currentUrl ? `<label class="switch"><input type="checkbox" name="__remove_image" /><span class="track"></span><span>Remove current image</span></label>` : ""}
      </div>
    </div></div>`;
}

function readForm(fields, formEl) {
  const out = {};
  for (const f of fields) {
    const el = formEl.elements[f.name];
    if (!el) continue;
    if (f.type === "bool") out[f.name] = el.checked;
    else if (f.type === "number") out[f.name] = el.value === "" ? "" : Number(el.value);
    else if (f.type === "keywords") out[f.name] = el.value.split(",").map((s) => s.trim().toLowerCase()).filter(Boolean);
    else out[f.name] = el.value.trim();
  }
  return out;
}

function showFieldErrors(formEl, err) {
  $$("[data-err]", formEl).forEach((e) => { e.classList.add("hidden"); e.textContent = ""; });
  $$(".invalid", formEl).forEach((e) => e.classList.remove("invalid"));
  let shown = false;
  for (const d of err?.details || []) {
    const box = $(`[data-err="${CSS.escape(d.field)}"]`, formEl);
    if (box) {
      box.textContent = d.message; box.classList.remove("hidden");
      formEl.elements[d.field]?.classList?.add("invalid");
      shown = true;
    }
  }
  if (!shown || err.status !== 400) toastError(err);
  else toast("Please fix the highlighted fields", "error");
}

function wireFormExtras(root) {
  $$("[data-gradient]", root).forEach((sel) => sel.addEventListener("change", () => {
    $("[data-swatch]", sel.parentElement).style.background = gradientCss(sel.value);
  }));
  $$("[data-img-input]", root).forEach((input) => input.addEventListener("change", () => {
    const file = input.files[0];
    const preview = $("[data-img-preview]", root);
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { toast("Image is larger than 5 MB", "error"); input.value = ""; return; }
    preview.innerHTML = `<img src="${URL.createObjectURL(file)}" alt="" />`;
  }));
}

const setTitle = (t) => { const el = $("#pageTitle"); if (el) el.textContent = t; document.title = `${t} · ClickAddis Admin`; };
const view = () => $("#view");
const loadingHtml = '<div class="loading"><span class="spinner"></span></div>';

async function route() {
  if (!state.token || !state.user || (state.expiresAt && state.expiresAt * 1000 < Date.now())) {
    if (state.token) return logout("Your session has expired. Please log in again.");
    return renderLogin();
  }
  if (!$("#app")) renderShell();
  $("#app").classList.remove("nav-open");

  const hash = location.hash || "#/dashboard";
  $$("[data-nav]").forEach((a) => a.classList.toggle("active", hash === a.dataset.nav || hash.startsWith(a.dataset.nav + "/")));
  const [, page, param] = hash.split("/");
  view().innerHTML = loadingHtml;
  window.scrollTo(0, 0);

  try {
    if (page === "dashboard" || !page) await pageDashboard();
    else if (page === "messages") await pageMessages();
    else if (page === "settings") await pageSettings();
    else if (page === "content" && RESOURCES[param]) await pageResource(RESOURCES[param]);
    else if (page === "users" && state.user.role === "superadmin") await pageUsers();
    else if (page === "account") await pageAccount();
    else { location.hash = "#/dashboard"; return; }
  } catch (err) {
    if (err.status === 401) return;
    view().innerHTML = `<div class="card empty">${icon("alert")}<h4>Could not load this page</h4><p>${esc(err.message)}</p>
      <button class="btn" data-action="reload">${icon("refresh", "sm")} Try again</button></div>`;
  }
  refreshMessageCount();
}

async function refreshMessageCount() {
  try {
    const { data } = await api("/admin/contact-messages/stats");
    state.newMessages = data.new || 0;
    const el = $("#msgCount");
    if (el) { el.textContent = state.newMessages; el.classList.toggle("hidden", !state.newMessages); }
  } catch { /* ignore */ }
}

   Login
   ========================================================================== */
function renderLogin(message) {
  document.title = "Log in · ClickAddis Admin";
  $("#root").innerHTML = `
    <div class="login">
      <div class="card login-card">
        <div class="brand"><div class="brand-logo">CA</div><div><b>ClickAddis</b><span>Admin panel</span></div></div>
        <h2>Welcome back</h2>
        <p class="muted" style="margin:0">Sign in to manage the website.</p>
        <form id="loginForm" novalidate>
          ${message ? `<div class="alert info">${esc(message)}</div>` : ""}
          ${SERVED_BY_BACKEND ? "" : `<div class="alert info">Tip: the admin panel works best at <a href="http://localhost:5000/admin">http://localhost:5000/admin</a> (served by the backend).</div>`}
          <div class="alert hidden" id="loginError"></div>
          <div class="field"><label for="lu">Username</label><input class="input" id="lu" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required /></div>
          <div class="field"><label for="lp">Password</label><input class="input" id="lp" name="password" type="password" autocomplete="current-password" required /></div>
          <button class="btn primary" type="submit" style="height:40px">Sign in</button>
        </form>
        <details style="margin-top:18px" class="small muted">
          <summary style="cursor:pointer">Server settings</summary>
          <div class="field" style="margin-top:10px"><label for="apiBase">API address</label>
            <div class="input-group"><input class="input" id="apiBase" value="${esc(API)}" /><button class="btn" type="button" data-action="save-api">Save</button></div>
            <div class="help">Default: this server's /api</div></div>
        </details>
      </div>
    </div>`;
  setTimeout(() => $("#lu")?.focus(), 30);
  $("#loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.currentTarget, btn = $("button[type=submit]", form), box = $("#loginError");
    const username = form.username.value.trim(), password = form.password.value;
    box.classList.add("hidden");
    if (!username || !password) { box.textContent = "Enter your username and password."; box.classList.remove("hidden"); return; }
    setBusy(btn, true, "Signing in…");
    try {
      const { data } = await api("/auth/login", { method: "POST", body: { username, password } });
      saveSession(data);
      $("#root").innerHTML = "";
      if (!location.hash || location.hash === "#/") location.hash = "#/dashboard";
      route();
      toast(`Welcome, ${data.user.full_name}`);
    } catch (err) {
      box.textContent = err.message; box.classList.remove("hidden");
      setBusy(btn, false);
    }
  });
}

async function pageDashboard() {
  setTitle("Dashboard");

    api("/admin/contact-messages/stats").then((r) => r.data),
    api("/admin/contact-messages?limit=5").then((r) => r.data),
    ...contentKeys.map((k) => api(`/admin/${RESOURCES[k].path}`).then((r) => r.data).catch(() => [])),
  ]);
  const counts = Object.fromEntries(contentKeys.map((k, i) => [k, lists[i]]));
  const card = (href, ic, value, label) => `<a class="card stat" href="${href}"><div class="ic">${icon(ic)}</div><div><b>${value}</b><span>${label}</span></div></a>`;
  const active = (k) => counts[k].filter((r) => r[RESOURCES[k].activeKey]).length;

  view().innerHTML = `
    <div class="page-head"><div><h2>Hello, ${esc(state.user.full_name.split(" ")[0])} 👋</h2><p>Here's what's happening on the ClickAddis website.</p></div></div>
    <div class="stats">
      ${card("#/messages", "inbox", msgStats.new, "New messages")}
      ${card("#/content/services", "monitor", active("services"), "Services")}
      ${card("#/content/solutions", "box", active("solutions"), "ERP solutions")}
      ${card("#/content/customers", "building", active("customers"), "Customers")}
      ${card("#/content/testimonials", "quote", active("testimonials"), "Testimonials")}
      ${card("#/content/team", "users", active("team"), "Team members")}
    </div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
      <div class="card">
        <div class="card-head"><div class="grow"><h3>Latest messages</h3><p>From the website contact form</p></div><a class="btn sm" href="#/messages">View all</a></div>
        ${recent.length ? `<div class="table-wrap"><table class="table"><tbody>${recent.map((m) => `
          <tr class="clickable ${m.status === "new" ? "unread" : ""}" data-action="open-message" data-id="${m.id}">
            <td><div class="ellipsis" style="max-width:260px">${esc(m.full_name)}</div><div class="small muted ellipsis" style="max-width:260px">${esc(m.message)}</div></td>
            <td class="num">${statusBadge(m.status)}<div class="small muted" style="margin-top:3px;text-align:right">${fmtRel(m.created_at)}</div></td></tr>`).join("")}</tbody></table></div>`
          : `<div class="empty">${icon("inbox")}<h4>No messages yet</h4><p>Contact form submissions will appear here.</p></div>`}
      </div>
      <div class="card">
        <div class="card-head"><div class="grow"><h3>Messages by status</h3><p>All time</p></div></div>
        <div class="card-body stack" style="gap:12px">
          ${MSG_STATUSES.map(([k, label, tone]) => {
            const total = Object.values(msgStats).reduce((a, b) => a + b, 0) || 1;
            const pct = Math.round(((msgStats[k] || 0) / total) * 100);
            return `<div><div class="row" style="margin-bottom:5px"><span class="badge dot ${tone}">${label}</span><span class="grow"></span><b>${msgStats[k] || 0}</b></div>
              <div style="height:6px;border-radius:9px;background:var(--panel-2);overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--primary);border-radius:9px"></div></div></div>`;
          }).join("")}
        </div>
      </div>
      <div class="card">
        <div class="card-head"><div class="grow"><h3>Quick actions</h3><p>Common tasks</p></div></div>
        <div class="card-body stack" style="gap:8px">

          <a class="btn" href="#/content/testimonials" style="justify-content:flex-start">${icon("quote", "sm")} Add a testimonial</a>

async function reloadResource() {

async function openResourceForm(res, row) {
  const isEdit = Boolean(row);
  let fields = res.fields;

  if (res.key === "testimonials") {
    const customers = await api("/admin/customers").then((r) => r.data).catch(() => []);
    fields = fields.map((f) => f.name === "customer_id" ? { ...f, options: [["", "— None —"], ...customers.map((c) => [c.id, c.name])] } : f);
  }

  const values = { ...(row || {}) };
  if (!isEdit) {
    const maxOrder = Math.max(0, ...pageState.rows.map((r) => Number(r[res.orderKey]) || 0));
    values[res.orderKey] = maxOrder + 1;
  }

  const root = openModal({
    title: isEdit ? `Edit ${res.single}` : `Add ${res.single}`,
    size: "lg",
    body: `<form id="resForm" class="grid cols-2" novalidate>
      ${fields.map((f) => fieldHtml(f, isEdit || values[f.name] !== undefined ? values[f.name] : undefined)).join("")}
      ${res.image ? imageFieldHtml(res.image, row?.[res.image.col]) : ""}
      ${res.key === "chatFaqs" ? `<div class="field span-all"><label>Preview</label><div class="preview-chat" id="faqPreview">${markdownPreview(values.response || "")}</div></div>` : ""}
    </form>`,
    footer: `<button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" id="resSave">${isEdit ? "Save changes" : `Add ${esc(res.single)}`}</button>`,
  });
  wireFormExtras(root);
  const form = $("#resForm", root);
  if (res.key === "chatFaqs") form.response.addEventListener("input", (e) => { $("#faqPreview").innerHTML = markdownPreview(e.target.value); });
  form.addEventListener("submit", (e) => { e.preventDefault(); $("#resSave").click(); });

  $("#resSave", root).addEventListener("click", async () => {
    const btn = $("#resSave", root);
    if (!form.reportValidity()) return;
    const data = readForm(fields, form);
    if (!data.slug) delete data.slug;
    const file = form.__image?.files?.[0];
    const removeImage = form.__remove_image?.checked;

    let options;
    if (res.image) {
      const fd = new FormData();
      for (const [k, v] of Object.entries(data)) fd.append(k, Array.isArray(v) ? JSON.stringify(v) : v === null ? "" : String(v));
      if (file) fd.append("image", file);
      else if (removeImage) fd.append("remove_image", "true");
      options = { form: fd };
    } else {
      options = { body: data };
    }

    setBusy(btn, true, "Saving…");
    try {
      await api(isEdit ? `/admin/${res.path}/${row.id}` : `/admin/${res.path}`, { method: isEdit ? "PATCH" : "POST", ...options });
      closeModal();
      toast(isEdit ? "Changes saved" : `${res.single[0].toUpperCase() + res.single.slice(1)} added`);
      await reloadResource();
    } catch (err) {
      setBusy(btn, false);
      showFieldErrors(form, err);
    }
  });
}

async function moveResource(id, dir) {
  const { res, rows } = pageState;
  const i = rows.findIndex((r) => r.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= rows.length) return;
  // normalise order values to the current positions, then swap the two rows
  const updates = [];
  rows.forEach((r, idx) => {
    let target = idx + 1;
    if (idx === i) target = j + 1; else if (idx === j) target = i + 1;
    if (Number(r[res.orderKey]) !== target) updates.push([r.id, target]);
  });
  try {
    await Promise.all(updates.map(([rid, order]) => api(`/admin/${res.path}/${rid}`, { method: "PATCH", body: { [res.orderKey]: order } })));
    await reloadResource();
  } catch (err) { toastError(err); await reloadResource(); }
}

    setBusy(btn, true, "Saving…");
    try {
      await api(isEdit ? `/admin/users/${user.id}` : "/admin/users", { method: isEdit ? "PATCH" : "POST", body: data });
      closeModal();
      if (isEdit) toast("Account updated");
      else showCredentials(data.username, data.password, "Admin account created");
      await pageUsers();
    } catch (err) { setBusy(btn, false); showFieldErrors(form, err); }
  });
}

function openPasswordReset(user) {
  const root = openModal({
    title: `Reset password — ${user.full_name}`, size: "sm",
    body: `<form id="pwForm" class="grid" novalidate>${fieldHtml({ name: "password", label: "New password", type: "password", required: true, help: "The admin will be signed out of all devices." })}</form>`,
    footer: `<button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" id="pwSave">Reset password</button>`,
  });
  const form = $("#pwForm", root);
  form.password.value = randomPassword();
  $("#pwSave", root).addEventListener("click", async (e) => {
    if (!form.reportValidity()) return;
    const btn = e.currentTarget, password = form.password.value;
    setBusy(btn, true, "Saving…");
    try {
      await api(`/admin/users/${user.id}`, { method: "PATCH", body: { password } });
      closeModal(); showCredentials(user.username, password, "Password reset");
    } catch (err) { setBusy(btn, false); showFieldErrors(form, err); }
  });
}

function showCredentials(username, password, title) {
  const root = openModal({
    title, size: "sm",
    body: `<p style="margin-top:0">Share these login details securely. The password won't be shown again.</p>
      <dl class="detail-grid"><dt>Login page</dt><dd class="mono">${esc(location.origin + location.pathname)}</dd>
      <dt>Username</dt><dd class="mono">${esc(username)}</dd><dt>Password</dt><dd class="mono">${esc(password)}</dd></dl>`,
    footer: `<button class="btn" id="copyCreds">Copy</button><button class="btn primary" data-action="close-modal">Done</button>`,
  });
  $("#copyCreds", root).addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(`Login: ${location.origin + location.pathname}\nUsername: ${username}\nPassword: ${password}`); toast("Copied to clipboard"); }
    catch { toast("Copy failed — select the text manually", "error"); }
  });
}

/* ============================================================================
   My account
   ========================================================================== */
async function pageAccount() {
  setTitle("My Account");
  const { data: me } = await api("/auth/me");
  state.user = me; localStorage.setItem("ca_user", JSON.stringify(me));
  view().innerHTML = `
    <div class="page-head"><div><h2>My Account</h2><p>Your profile, password and preferences.</p></div></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start">
      <div class="card"><div class="card-head"><div class="grow"><h3>Profile</h3></div></div>
        <div class="card-body"><div class="row" style="margin-bottom:16px"><div class="avatar" style="width:52px;height:52px;font-size:18px">${esc(initials(me.full_name))}</div>
          <div><b style="font-size:16px">${esc(me.full_name)}</b><div class="muted">@${esc(me.username)}</div></div></div>
          <dl class="detail-grid"><dt>Role</dt><dd>${me.role === "superadmin" ? "Superadmin" : "Admin"}</dd><dt>Last login</dt><dd>${fmtDate(me.last_login_at)}</dd><dt>Member since</dt><dd>${fmtDate(me.created_at)}</dd></dl></div></div>
      <div class="card"><div class="card-head"><div class="grow"><h3>Change password</h3><p>You will stay signed in on this device only.</p></div></div>
        <form class="card-body grid" id="cpForm" novalidate>
          <div class="field"><label for="cp1">Current password</label><input class="input" id="cp1" name="current_password" type="password" autocomplete="current-password" required /><div class="err hidden" data-err="current_password"></div></div>
          <div class="field"><label for="cp2">New password</label><input class="input" id="cp2" name="new_password" type="password" autocomplete="new-password" minlength="8" required /><div class="help">At least 8 characters</div><div class="err hidden" data-err="new_password"></div></div>
          <div class="field"><label for="cp3">Confirm new password</label><input class="input" id="cp3" name="confirm" type="password" autocomplete="new-password" required /></div>
          <div><button class="btn primary" type="submit">Update password</button></div>
        </form></div>
      <div class="card"><div class="card-head"><div class="grow"><h3>Preferences</h3><p>Stored on this device</p></div></div>
        <form class="card-body grid" id="prefForm">
          <div class="field"><label for="siteUrl">Public website address</label><input class="input" id="siteUrl" value="${esc(siteUrl())}" /><div class="help">Used by the “View website” button</div></div>
          <div><button class="btn" type="submit">Save preferences</button></div>
        </form></div>
    </div>`;

  $("#cpForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.currentTarget, btn = $("button[type=submit]", form);
    if (!form.reportValidity()) return;
    if (form.new_password.value !== form.confirm.value) return toast("The new passwords do not match", "error");
    setBusy(btn, true, "Updating…");
    try {
      const { data } = await api("/auth/change-password", { method: "POST", body: { current_password: form.current_password.value, new_password: form.new_password.value } });
      saveSession(data); form.reset(); toast("Password updated");
    } catch (err) { showFieldErrors(form, err); }
    finally { setBusy(btn, false); }
  });
  $("#prefForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const v = $("#siteUrl").value.trim();
    if (v) localStorage.setItem(SITE_URL_KEY, v); else localStorage.removeItem(SITE_URL_KEY);
    toast("Preferences saved");
    renderShell(); route();
  });
}

/* ============================================================================
   Global event delegation
   ========================================================================== */
const actions = {
  "close-modal": () => closeModal(),
  "open-nav": () => $("#app").classList.add("nav-open"),
  "close-nav": () => $("#app").classList.remove("nav-open"),
  "reload": () => route(),
  "logout": async () => { if (await confirmDialog({ title: "Log out?", message: "You will need to sign in again.", confirmText: "Log out", danger: false })) logout("You have been logged out."); },
  "toggle-theme": (el) => {
    const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
    document.documentElement.dataset.theme = next;
    localStorage.setItem("ca_theme", next);
    el.innerHTML = icon(next === "light" ? "moon" : "sun");
  },
  "save-api": () => {
    const v = $("#apiBase").value.trim();
    if (v) localStorage.setItem("ca_api_base", v); else localStorage.removeItem("ca_api_base");
    location.reload();
  },
  "gen-password": (el) => { const input = document.getElementById(el.dataset.target); input.value = randomPassword(); input.focus(); input.select(); },

  "res-new": () => openResourceForm(pageState.res).catch(toastError),
  "res-edit": (el) => openResourceForm(pageState.res, pageState.rows.find((r) => r.id === el.dataset.id)).catch(toastError),
  "res-move": (el) => moveResource(el.dataset.id, Number(el.dataset.dir)),
  "res-toggle": async (el) => {
    const { res } = pageState;
    try {
      await api(`/admin/${res.path}/${el.dataset.id}`, { method: "PATCH", body: { [res.activeKey]: el.checked } });
      const row = pageState.rows.find((r) => r.id === el.dataset.id); if (row) row[res.activeKey] = el.checked;
      toast(el.checked ? "Now visible on the website" : "Hidden from the website");
    } catch (err) { el.checked = !el.checked; toastError(err); }
  },
  "res-delete": async (el) => {
    const { res } = pageState;
    const row = pageState.rows.find((r) => r.id === el.dataset.id);
    if (!(await confirmDialog({ title: `Delete ${res.single}?`, message: `<b>${esc(res.titleOf(row))}</b> will be permanently removed from the website${res.image ? " together with its image" : ""}.` }))) return;
    try { await api(`/admin/${res.path}/${row.id}`, { method: "DELETE" }); toast("Deleted"); await reloadResource(); }
    catch (err) { toastError(err); }
  },

  "settings-img-remove": async (el) => {
    if (!(await confirmDialog({ title: "Remove image?", message: "The website will fall back to its built-in default image.", confirmText: "Remove" }))) return;
    try {
      const { data } = await api(`/admin/settings/images/${el.dataset.key}`, { method: "DELETE" });
      pageState.settings = { ...pageState.settings, ...pickImageCols(data) };
      renderSettingsImages(); toast("Image removed");
    } catch (err) { toastError(err); }
  },

  "open-message": (el) => openMessage(el.dataset.id).catch(toastError),
  "msg-tab": (el) => { msgState.status = el.dataset.status; msgState.page = 1; loadMessages().catch(toastError); },
  "msg-page": (el) => { msgState.page += Number(el.dataset.dir); loadMessages().catch(toastError); },
  "msg-refresh": () => loadMessages().then(() => toast("Refreshed", "info")).catch(toastError),

  "user-new": () => openUserForm(),
  "user-edit": (el) => openUserForm(pageState.users.find((u) => u.id === el.dataset.id)),
  "user-password": (el) => openPasswordReset(pageState.users.find((u) => u.id === el.dataset.id)),
  "user-toggle": async (el) => {
    const u = pageState.users.find((x) => x.id === el.dataset.id);
    try {
      await api(`/admin/users/${u.id}`, { method: "PATCH", body: { is_active: el.checked } });
      u.is_active = el.checked;
      const label = el.parentElement.querySelector("span.small");
      label.textContent = el.checked ? "Active" : "Inactive"; label.classList.toggle("muted", !el.checked);
      toast(el.checked ? `${u.full_name} activated` : `${u.full_name} deactivated and signed out`);
    } catch (err) { el.checked = !el.checked; toastError(err); }
  },
  "user-delete": async (el) => {
    const u = pageState.users.find((x) => x.id === el.dataset.id);
    if (!(await confirmDialog({ title: "Delete admin?", message: `<b>${esc(u.full_name)}</b> (@${esc(u.username)}) will lose access permanently. Consider deactivating instead.` }))) return;
    try { await api(`/admin/users/${u.id}`, { method: "DELETE" }); toast("Admin deleted"); await pageUsers(); }
    catch (err) { toastError(err); }
  },
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.action];
  if (!fn) return;
  if (el.tagName !== "INPUT") e.preventDefault();
  fn(el, e);
});

/* ============================================================================
   Boot
   ========================================================================== */
(() => {
  const theme = localStorage.getItem("ca_theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  document.documentElement.dataset.theme = theme;
})();
window.addEventListener("hashchange", route);
window.addEventListener("online", () => { if (state.token) { renderShell(); route(); } });
window.addEventListener("offline", () => toast("You are offline", "error"));
setInterval(() => { if (state.token && document.visibilityState === "visible") refreshMessageCount(); }, 60_000);
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
route();
</script>
</body>
